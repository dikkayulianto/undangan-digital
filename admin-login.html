<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Administrator - Inveet.id</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            admin: {
              50: '#f8fafc',
              100: '#f1f5f9',
              800: '#1e293b',
              900: '#0f172a'
            },
            gold: {
              400: '#e5be70',
              500: '#cfa243'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            serif: ['"Cormorant Garamond"', 'serif']
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex items-center justify-center p-4 antialiased selection:bg-amber-500 selection:text-black">

  <div class="max-w-md w-full bg-slate-900/90 rounded-3xl p-8 shadow-2xl border border-slate-800 space-y-6 backdrop-blur-xl relative">
    
    <!-- Glow Effect -->
    <div class="absolute -top-12 -left-12 w-32 h-32 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-12 -right-12 w-32 h-32 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Header -->
    <div class="text-center space-y-2">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-br from-amber-500 to-amber-700 text-slate-950 font-bold shadow-lg shadow-amber-500/20 mb-2">
        <i data-lucide="shield-check" class="w-7 h-7"></i>
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-white">Portal Administrator</h1>
      <p class="text-xs text-slate-400">Masuk untuk membuat akun pembeli dan mengelola undangan digital</p>
    </div>

    <!-- Form -->
    <form id="adminLoginForm" class="space-y-4">
      <div id="loginErrorMsg" class="hidden p-3 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-xs flex items-center gap-2">
        <i data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i>
        <span>Username atau kata sandi admin salah.</span>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Username Admin</label>
        <div class="relative">
          <i data-lucide="user" class="w-4 h-4 text-slate-500 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
          <input type="text" id="adminUserInput" placeholder="Masukkan username" required class="w-full pl-10 pr-3.5 py-2.5 rounded-xl border border-slate-700 bg-slate-800 text-white text-xs focus:ring-2 focus:ring-amber-500 outline-none">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Kata Sandi</label>
        <div class="relative">
          <i data-lucide="lock" class="w-4 h-4 text-slate-500 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
          <input type="password" id="adminPassInput" placeholder="••••••••" required class="w-full pl-10 pr-3.5 py-2.5 rounded-xl border border-slate-700 bg-slate-800 text-white text-xs focus:ring-2 focus:ring-amber-500 outline-none">
        </div>
      </div>

      <button type="submit" class="w-full py-2.5 rounded-xl bg-slate-100 hover:bg-white text-slate-900 font-bold text-xs shadow-lg transition flex items-center justify-center gap-2 cursor-pointer">
        <i data-lucide="log-in" class="w-4 h-4"></i>
        <span>Masuk ke Panel Admin</span>
      </button>
    </form>

    <!-- Footer link to user login -->
    <div class="pt-4 border-t border-slate-800/80 flex items-center justify-between text-xs text-slate-400">
      <a href="login.html" class="hover:text-amber-400 transition flex items-center gap-1">
        <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
        <span>Login Pembeli / User</span>
      </a>
      <a href="index.html" class="hover:text-slate-200 transition">Beranda Web</a>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) lucide.createIcons();

      function doAdminLogin(user, pass) {
        if ((user === 'admin' || user === 'admin@inveet.id') && pass === 'admin123') {
          sessionStorage.setItem('inveet_admin_session', 'true');
          localStorage.setItem('inveet_admin_session', 'true');
          window.location.href = 'admin.html';
        } else {
          const err = document.getElementById('loginErrorMsg');
          if (err) err.classList.remove('hidden');
        }
      }

      document.getElementById('adminLoginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const u = document.getElementById('adminUserInput').value.trim();
        const p = document.getElementById('adminPassInput').value.trim();
        doAdminLogin(u, p);
      });
    });
  </script>
</body>
</html>
