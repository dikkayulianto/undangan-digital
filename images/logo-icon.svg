<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="50%" stop-color="#2d1a0e" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>

    <!-- Gold Metallic Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#f59e0b" />
      <stop offset="60%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Shimmer Highlight Gradient -->
    <linearGradient id="shimmerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0.3" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#f59e0b" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Container Box with Rounded Corners -->
  <rect x="4" y="4" width="112" height="112" rx="26" fill="url(#bgGrad)" stroke="#d97706" stroke-opacity="0.35" stroke-width="2" />
  
  <!-- Inner subtle border -->
  <rect x="7" y="7" width="106" height="106" rx="23" fill="none" stroke="#fef08a" stroke-opacity="0.08" stroke-width="1" />

  <!-- Monogram 'B' / Stylized Invitation Ribbon -->
  <g filter="url(#goldGlow)" transform="translate(4, 0)">
    <!-- Vertical Spine of B -->
    <rect x="32" y="28" width="11" height="64" rx="5.5" fill="url(#goldGrad)" />
    
    <!-- Top Loop of B (Envelope & Heart Curve Motif) -->
    <path d="M 37 28 
             H 62 
             C 74 28, 83 35, 83 46 
             C 83 56, 74 61, 62 61 
             H 37 Z" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="10" 
          stroke-linejoin="round" 
          stroke-linecap="round" />

    <!-- Bottom Loop of B (Slightly larger, elegant invitation fold) -->
    <path d="M 37 59 
             H 66 
             C 79 59, 88 67, 88 78 
             C 88 89, 78 92, 64 92 
             H 37 Z" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="10" 
          stroke-linejoin="round" 
          stroke-linecap="round" />

    <!-- Center Fold Accent / Sealed Invitation Flap Line -->
    <path d="M 44 45 L 56 53 L 68 45" 
          fill="none" 
          stroke="#fef08a" 
          stroke-width="2.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          opacity="0.85" />

    <!-- Sparkling Star Accent on Top Right -->
    <path d="M 87 23 
             Q 87 31 95 31 
             Q 87 31 87 39 
             Q 87 31 79 31 
             Q 87 31 87 23 Z" 
          fill="url(#shimmerGrad)" />
  </g>
</svg>
