<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk ke Undangan Anda - Inveet.id</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gold: {
              50: '#fbf8f3',
              100: '#f4ede0',
              200: '#ebd9bf',
              300: '#dfbe96',
              400: '#d1a06d',
              500: '#c5a880',
              600: '#b87b38',
              700: '#99602e',
              800: '#7c4d29',
              900: '#653f24'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            serif: ['"Cormorant Garamond"', 'serif']
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-stone-100 text-stone-800 font-sans min-h-screen flex items-center justify-center p-4 antialiased">

  <div class="max-w-md w-full bg-white rounded-3xl p-8 shadow-2xl border border-stone-200 space-y-6 relative">
    
    <!-- Logo & Header -->
    <div class="text-center space-y-2">
      <a href="index.html" class="inline-flex items-center gap-2 mb-1">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-amber-700 to-stone-900 text-gold-300 font-serif font-bold text-xl flex items-center justify-center shadow">
          I
        </div>
        <span class="text-2xl font-bold tracking-tight text-stone-900">inveet<span class="text-amber-600">.id</span></span>
      </a>
      <h1 class="text-xl font-bold text-stone-900">Masuk ke Undangan Anda</h1>
      <p class="text-xs text-stone-500">Kelola foto, data tasyakuran, musik, dan daftar tamu undangan Anda.</p>
    </div>

    <!-- QUICK PRESET BUYER ACCOUNTS (For Easy Testing) -->
    <div class="p-4 rounded-2xl bg-amber-50/70 border border-amber-200 space-y-2.5">
      <div class="flex items-center justify-between">
        <span class="text-[10px] font-bold uppercase tracking-wider text-amber-900 bg-amber-100 px-2 py-0.5 rounded-full">
          Coba Akun Pembeli Siap Pakai
        </span>
        <span class="text-[10px] text-amber-700 font-medium">Klik untuk login:</span>
      </div>
      
      <div class="grid grid-cols-2 gap-2 text-xs">
        <button type="button" class="btn-demo-client p-2.5 rounded-xl bg-white hover:bg-emerald-50 border border-stone-200 hover:border-emerald-400 text-left transition cursor-pointer"
                data-user="rendy" data-pass="password123">
          <div class="font-bold text-stone-900 flex items-center gap-1">
            <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
            <span>Rendy</span>
          </div>
          <div class="text-[10px] text-stone-500">Walimatul Khitan</div>
        </button>

        <button type="button" class="btn-demo-client p-2.5 rounded-xl bg-white hover:bg-emerald-50 border border-stone-200 hover:border-emerald-400 text-left transition cursor-pointer"
                data-user="fadhil" data-pass="password123">
          <div class="font-bold text-stone-900 flex items-center gap-1">
            <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
            <span>Fadhil</span>
          </div>
          <div class="text-[10px] text-stone-500">Khitanan Akun Lain</div>
        </button>
      </div>
    </div>

    <div class="relative flex py-1 items-center">
      <div class="flex-grow border-t border-stone-200"></div>
      <span class="flex-shrink mx-4 text-stone-400 text-[11px] uppercase tracking-wider">Atau Masuk dengan Akun Anda</span>
      <div class="flex-grow border-t border-stone-200"></div>
    </div>

    <!-- Error Alert -->
    <div id="loginError" class="hidden p-3 rounded-xl bg-red-50 border border-red-200 text-red-700 text-xs flex items-center gap-2">
      <i data-lucide="alert-circle" class="w-4 h-4 shrink-0 text-red-600"></i>
      <span id="loginErrorText">Username atau kata sandi tidak sesuai.</span>
    </div>

    <!-- Buyer Login Form -->
    <form id="buyerLoginForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-stone-700 mb-1">Username / ID Klien Pembeli</label>
        <div class="relative">
          <i data-lucide="user" class="w-4 h-4 text-stone-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
          <input type="text" id="buyerUsername" required placeholder="contoh: rendy atau fadhil" class="w-full pl-10 pr-3.5 py-2.5 rounded-xl border border-stone-300 text-xs focus:ring-2 focus:ring-amber-600 outline-none bg-stone-50/50">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-stone-700 mb-1">Kata Sandi</label>
        <div class="relative">
          <i data-lucide="lock" class="w-4 h-4 text-stone-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
          <input type="password" id="buyerPassword" required placeholder="Masukkan kata sandi..." class="w-full pl-10 pr-3.5 py-2.5 rounded-xl border border-stone-300 text-xs focus:ring-2 focus:ring-amber-600 outline-none bg-stone-50/50">
        </div>
      </div>

      <button type="submit" class="w-full py-2.5 rounded-xl bg-stone-900 hover:bg-stone-800 text-white font-bold text-xs shadow-md transition flex items-center justify-center gap-2 cursor-pointer">
        <i data-lucide="log-in" class="w-4 h-4"></i>
        <span>Masuk ke Editor Undangan</span>
      </button>
    </form>

    <!-- Bottom Actions -->
    <div class="pt-4 border-t border-stone-200 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs">
      <a href="index.html" class="inline-flex items-center gap-1.5 text-stone-500 hover:text-stone-900 transition">
        <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
        <span>Beranda Web</span>
      </a>

      <!-- LINK TO DEDICATED ADMIN PORTAL -->
      <a href="admin-login.html" class="inline-flex items-center gap-1.5 text-amber-800 hover:text-amber-950 font-bold bg-amber-50 hover:bg-amber-100 px-3 py-1.5 rounded-xl border border-amber-300/60 transition">
        <i data-lucide="shield-check" class="w-3.5 h-3.5 text-amber-700"></i>
        <span>Portal Admin Inveet &rarr;</span>
      </a>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) lucide.createIcons();

      // Sample Accounts Fallback
      const initialAccounts = [
        {
          id: 'client-rendy',
          username: 'rendy',
          password: 'password123',
          name: 'Bpk. Wangkis Suwito & Ibu Susi (Irendy)',
          type: 'khitan',
          phone: '082134966499',
          tier: 'Paket Sapphire VIP'
        },
        {
          id: 'client-fadhil',
          username: 'fadhil',
          password: 'password123',
          name: 'Bpk. Hendra Gunawan & Ibu Nur (Fadhil)',
          type: 'khitan',
          phone: '081234567890',
          tier: 'Paket Sapphire VIP'
        },
        {
          id: 'client-dimas-sarah',
          username: 'dimas-sarah',
          password: 'password123',
          name: 'Dimas Pratama & Sarah Azhari',
          type: 'nikah',
          phone: '081987654321',
          tier: 'Paket Sapphire VIP'
        }
      ];

      function getAccounts() {
        try {
          const saved = localStorage.getItem('inveet_client_accounts');
          if (saved) return JSON.parse(saved);
        } catch(e) {}
        localStorage.setItem('inveet_client_accounts', JSON.stringify(initialAccounts));
        return initialAccounts;
      }

      function doClientLogin(username, password) {
        const errorBox = document.getElementById('loginError');
        const errorText = document.getElementById('loginErrorText');
        errorBox.classList.add('hidden');

        const accounts = getAccounts();
        const found = accounts.find(a => 
          a.username.toLowerCase() === username.toLowerCase().trim() && 
          a.password === password.trim()
        );

        if (found) {
          localStorage.setItem('inveet_logged_client', JSON.stringify(found));
          if (found.type === 'khitan') {
            window.location.href = `builder-khitan.html?client=${encodeURIComponent(found.username)}`;
          } else {
            window.location.href = `builder.html?client=${encodeURIComponent(found.username)}`;
          }
        } else {
          errorText.textContent = 'Username atau kata sandi tidak ditemukan. Silakan hubungi admin jika belum memiliki akun.';
          errorBox.classList.remove('hidden');
        }
      }

      // Demo buttons
      document.querySelectorAll('.btn-demo-client').forEach(btn => {
        btn.addEventListener('click', () => {
          const u = btn.getAttribute('data-user');
          const p = btn.getAttribute('data-pass');
          document.getElementById('buyerUsername').value = u;
          document.getElementById('buyerPassword').value = p;
          doClientLogin(u, p);
        });
      });

      // Submit
      document.getElementById('buyerLoginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const u = document.getElementById('buyerUsername').value.trim();
        const p = document.getElementById('buyerPassword').value.trim();
        doClientLogin(u, p);
      });
    });
  </script>
</body>
</html>
