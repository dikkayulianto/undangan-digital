<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk ke Akun - Inveet.id</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gold: {
              50: '#fbf8f3',
              100: '#f4ede0',
              200: '#ebd9bf',
              300: '#dfbe96',
              400: '#d1a06d',
              500: '#c5a880',
              600: '#b87b38',
              700: '#99602e',
              800: '#7c4d29',
              900: '#653f24'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            serif: ['"Cormorant Garamond"', 'serif']
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-stone-100 text-stone-800 font-sans min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white rounded-3xl p-8 shadow-xl border border-stone-200 space-y-6">
    
    <!-- Logo & Header -->
    <div class="text-center space-y-2">
      <a href="index.html" class="inline-flex items-center gap-2 mb-2">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-amber-700 to-stone-900 text-gold-300 font-serif font-bold text-xl flex items-center justify-center shadow">
          I
        </div>
        <span class="text-2xl font-bold tracking-tight text-stone-900">inveet<span class="text-amber-600">.id</span></span>
      </a>
      <h1 class="text-xl font-bold text-stone-900">Masuk ke Dashboard</h1>
      <p class="text-xs text-stone-500">Kelola dan pantau seluruh undangan digital Anda.</p>
    </div>

    <!-- ONE-CLICK DEMO LOGIN BUTTON (Highlighted) -->
    <div class="p-4 rounded-2xl bg-gradient-to-r from-amber-50 to-gold-50/70 border-2 border-amber-300 space-y-2">
      <div class="flex items-center justify-between">
        <span class="text-[10px] font-bold uppercase tracking-wider text-amber-900 bg-amber-100 px-2.5 py-0.5 rounded-full">
          Demo Pengguna Tersedia
        </span>
        <span class="text-[11px] font-bold text-emerald-700 flex items-center gap-1">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> Siap Pakai
        </span>
      </div>
      <p class="text-xs text-stone-600 leading-relaxed">
        Masuk sebagai <strong>Rizky Pratama</strong> (Paket Sapphire VIP) untuk langsung mencoba dashboard &amp; membuat undangan.
      </p>
      <button type="button" id="btnAutoLoginDemo" class="w-full py-2.5 rounded-xl bg-amber-800 hover:bg-amber-900 text-white font-bold text-xs shadow-md transition flex items-center justify-center gap-2 cursor-pointer">
        <i data-lucide="zap" class="w-4 h-4 text-gold-300"></i>
        <span>Login Cepat Akun Demo (1-Klik)</span>
      </button>
    </div>

    <div class="relative flex py-1 items-center">
      <div class="flex-grow border-t border-stone-200"></div>
      <span class="flex-shrink mx-4 text-stone-400 text-[11px] uppercase tracking-wider">Atau Masuk Biasa</span>
      <div class="flex-grow border-t border-stone-200"></div>
    </div>

    <!-- Regular Form -->
    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-stone-700 mb-1">Email Terdaftar</label>
        <div class="relative">
          <i data-lucide="mail" class="w-4 h-4 text-stone-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
          <input type="email" id="emailInput" value="rizky.pratama@gmail.com" required class="w-full pl-10 pr-3.5 py-2.5 rounded-xl border border-stone-300 text-xs focus:ring-2 focus:ring-amber-600 outline-none bg-stone-50/50">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-stone-700 mb-1">Kata Sandi</label>
        <div class="relative">
          <i data-lucide="lock" class="w-4 h-4 text-stone-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
          <input type="password" id="passwordInput" value="password123" required class="w-full pl-10 pr-3.5 py-2.5 rounded-xl border border-stone-300 text-xs focus:ring-2 focus:ring-amber-600 outline-none bg-stone-50/50">
        </div>
      </div>

      <div class="flex items-center justify-between text-xs">
        <label class="flex items-center gap-2 text-stone-600 cursor-pointer">
          <input type="checkbox" checked class="rounded text-amber-800 focus:ring-amber-600">
          <span>Ingat saya</span>
        </label>
        <a href="#" class="text-amber-800 hover:underline">Lupa sandi?</a>
      </div>

      <button type="submit" class="w-full py-2.5 rounded-xl bg-stone-900 hover:bg-stone-800 text-white font-bold text-xs shadow transition flex items-center justify-center gap-2 cursor-pointer">
        <i data-lucide="log-in" class="w-4 h-4"></i>
        <span>Masuk ke Dashboard</span>
      </button>
    </form>

    <div class="text-center pt-2 border-t border-stone-100 text-xs text-stone-500">
      <a href="index.html" class="inline-flex items-center gap-1.5 text-stone-600 hover:text-stone-900 font-semibold transition">
        <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
        <span>Kembali ke Beranda Website</span>
      </a>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) lucide.createIcons();

      function doLogin(name, email) {
        const userObj = {
          name: name || 'Rizky Pratama',
          email: email || 'rizky.pratama@gmail.com',
          phone: '081234567890',
          tier: 'Paket Sapphire VIP',
          avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80'
        };
        localStorage.setItem('inveet_user', JSON.stringify(userObj));
        window.location.href = 'dashboard.html';
      }

      document.getElementById('btnAutoLoginDemo').addEventListener('click', () => {
        doLogin('Rizky Pratama', 'rizky.pratama@gmail.com');
      });

      document.getElementById('loginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const em = document.getElementById('emailInput').value.trim();
        const nm = em.split('@')[0].replace('.', ' ').toUpperCase();
        doLogin(nm, em);
      });
    });
  </script>
</body>
</html>
